# Configuration for Cog ⚙️
# Reference: https://cog.run/yaml

build:
  # Set to true if your model requires a GPU
  gpu: true

  # A list of Ubuntu apt packages to install
  system_packages:
    - "libgl1-mesa-glx"
    - "libglib2.0-0"
    - "libjpeg-dev"
    - "libpng-dev"

  # Specify the Python version available on your system
  python_version: "3.12"

  # A list of Python packages to install in the format <package-name>==<version>
  python_packages:
    - torch==2.0.1
    - torchvision==0.15.2
    - diffusers==0.25.0
    - transformers==4.43.3
    - opencv-python
    - httpx==0.23.3
    - numpy>=1.24.4
    - timm
    - einops
    - ftfy
    - basicsr
    - facexlib
    - insightface
    - onnxruntime-gpu
    - accelerate
    - SentencePiece
    - fire
    - safetensors
    - invisible-watermark
    - setuptools
    - "albumentations==1.4.3"
    - "pydantic==1.10.11"

  # Commands run after the environment is set up
  run:
    - curl -o /usr/local/bin/pget -L "https://github.com/replicate/pget/releases/download/v0.8.2/pget_linux_x86_64" && chmod +x /usr/local/bin/pget
    - python3 -m pip install --upgrade pip torch numpy torchvision
    - python3 -c "import basicsr, os; f=os.path.join(os.path.dirname(basicsr.__file__), 'data/degradations.py'); os.system(f'sed -i \"8s/from torchvision.transforms.functional_tensor import rgb_to_grayscale/from torchvision.transforms.functional import rgb_to_grayscale/\" {f}') if os.path.exists(f) else print('WARNING: basicsr/data/degradations.py not found, skipping fix.')"

# Required command to run your model
command: "python3 predict.py"

# predict.py defines how predictions are run on your model
predict: "predict.py:Predictor"
